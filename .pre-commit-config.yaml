# Run with prek (fast Rust drop-in for pre-commit): `prek install`, `prek run --all-files`.
# This is the standard pre-commit config format; prek reads it unchanged.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-toml
      - id: check-json
        files: \.json$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.14.0
    hooks:
      - id: markdownlint-cli2

  # dprint runs from the mise-managed binary so the version matches local dev.
  - repo: local
    hooks:
      - id: dprint-fmt
        name: dprint fmt
        entry: dprint fmt
        language: system
        pass_filenames: false
        files: \.(md|json|jsonc)$
